<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fiverr-theme.css') }}?v=4&t={{ range(1000000) | random }}">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>window.__CACHE_BUST = Date.now();</script>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col lg:flex-row" {% block body_attrs %}{% endblock %}>

    <!-- Mobile Header -->
    <div class="lg:hidden mobile-header">
        <span class="brand-title">WesternFX IB</span>
        <button id="mobile-menu-btn" class="text-gray-500 hover:text-gray-700 focus:outline-none p-2">
            <i class="fas fa-bars text-lg"></i>
        </button>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden backdrop-blur-sm" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="hidden lg:block flex-shrink-0 transition-transform duration-200 fixed lg:static inset-y-0 left-0 z-40 lg:z-auto h-screen">
        <div class="h-full flex flex-col">
            <!-- Brand -->
            <div class="p-5 flex items-center justify-between">
                <div>
                    <h1 class="brand-title">WesternFX<span class="text-green-500">.</span></h1>
                    <p class="brand-subtitle mt-0.5">IB Management</p>
                </div>
                <button id="sidebar-close-btn" class="lg:hidden text-gray-400 hover:text-gray-600 focus:outline-none p-1" onclick="closeSidebar()">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <!-- Nav -->
            <nav class="px-3 space-y-0.5 flex-1 overflow-y-auto">
                <a href="/" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/clients" class="sidebar-link {% if request.path == '/clients' %}active{% endif %}">
                    <i class="fas fa-users"></i>
                    <span>All Clients</span>
                </a>
                <a href="/filters" class="sidebar-link {% if request.path == '/filters' %}active{% endif %}">
                    <i class="fas fa-filter"></i>
                    <span>Filters</span>
                </a>
                <a href="/sync" class="sidebar-link {% if request.path == '/sync' %}active{% endif %}">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Sync API 2</span>
                </a>
                <a href="/update" class="sidebar-link {% if request.path == '/update' %}active{% endif %}">
                    <i class="fas fa-sync"></i>
                    <span>Update Monthly</span>
                </a>

                <div class="pt-3 mt-3 border-t border-gray-200">
                    <a href="/settings" class="sidebar-link {% if request.path == '/settings' %}active{% endif %}">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </div>
            </nav>

            <!-- Footer -->
            <div class="p-4 border-t border-gray-200">
                <p class="text-xs text-gray-400">v2.6 — Fiverr Design</p>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto min-h-screen">
        <!-- Top Bar -->
        <div class="top-bar">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
            <div class="flex items-center gap-3">
                <div class="relative hidden sm:block">
                    <input type="text" id="global-search" placeholder="Search clients..."
                        class="fx-input pl-9 pr-4 py-2 w-52 lg:w-64 text-sm"
                        onkeydown="if(event.key==='Enter'){const v=this.value.trim();if(v)window.location.href='/clients?search='+encodeURIComponent(v);}">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                </div>
                <a href="/clients" class="sm:hidden text-gray-400 hover:text-gray-600 p-2" title="Search Clients">
                    <i class="fas fa-search"></i>
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div class="p-5 sm:p-6">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                overlay.classList.remove('hidden');
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }

        document.getElementById('mobile-menu-btn')?.addEventListener('click', toggleSidebar);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                info: 'bg-gray-800',
                success: 'bg-green-600',
                error: 'bg-red-500',
                warning: 'bg-amber-500'
            };
            toast.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded shadow-lg flex items-center gap-2 toast-fx max-w-xs sm:max-w-sm ml-auto`;
            toast.innerHTML = `<span class="text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function formatCurrency(value) {
            if (value === null || value === undefined || value === '') return '$0.00';
            const num = parseFloat(value);
            if (isNaN(num)) return '$0.00';
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(num);
        }

        function formatNumber(value) {
            if (value === null || value === undefined || value === '') return '0';
            const num = parseFloat(value);
            if (isNaN(num)) return '0';
            return new Intl.NumberFormat('en-US').format(num);
        }

        async function getJSON(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        async function postJSON(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        // Referrer filter removed — all data comes from API 3 (Tawhid's data)
        function buildUrlWithReferrer(baseUrl) { return baseUrl; }
        function getSelectedReferrer() { return ''; }
        function setSelectedReferrer(referrer) {}
        function initReferrerSelector() {}
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=3&t={{ range(1000000) | random }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
