<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        // Force cache bust on reload
        window.__CACHE_BUST = Date.now();
    </script>
    <style>
        /* Sidebar */
        #sidebar { width: 280px; }
        .sidebar-link { @apply flex items-center gap-3 px-4 py-2.5 text-gray-300 hover:bg-gray-800 hover:text-white transition rounded-lg text-sm; }
        .sidebar-link.active { @apply bg-blue-600 text-white; }
        .sidebar-link i { width: 20px; text-align: center; flex-shrink: 0; }
        /* KPI */
        .kpi-card { @apply bg-white rounded-xl shadow-sm border border-gray-100 p-4; }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition; }
        .btn-secondary { @apply bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition; }
        .btn-danger { @apply bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition; }
        .btn-success { @apply bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition; }
        .table-header { @apply px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider bg-gray-50; }
        .table-cell { @apply px-4 py-3 text-sm text-gray-700 border-b border-gray-100; }
        .status-active { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800; }
        .status-inactive { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800; }
        .status-new { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800; }
        .loading { @apply animate-pulse bg-gray-200 rounded; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col lg:flex-row" {% block body_attrs %}{% endblock %}>
    <!-- Mobile Header -->
    <div class="lg:hidden bg-gray-900 text-white p-4 flex items-center justify-between sticky top-0 z-30">
        <span class="font-bold text-lg">WesternFX IB</span>
        <button id="mobile-menu-btn" class="text-white focus:outline-none p-2">
            <i class="fas fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="closeSidebar()"></div>
        <!-- Sidebar -->
        <aside id="sidebar" class="hidden lg:block bg-gray-900 text-white flex-shrink-0 transition-transform duration-200 fixed lg:static inset-y-0 left-0 z-40 lg:z-auto">
            <div class="p-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-white">WesternFX IB</h1>
                    <p class="text-xs text-gray-400 mt-1">Client Management</p>
                </div>
                <button id="sidebar-close-btn" class="lg:hidden text-gray-400 hover:text-white focus:outline-none p-1" onclick="closeSidebar()">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

        <nav class="px-3 space-y-0.5">
                <a href="/" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/clients" class="sidebar-link {% if request.path == '/clients' %}active{% endif %}">
                    <i class="fas fa-users"></i>
                    <span>All Clients</span>
                </a>
                <a href="/filters" class="sidebar-link {% if request.path == '/filters' %}active{% endif %}">
                    <i class="fas fa-filter"></i>
                    <span>Filters</span>
                </a>
                <a href="/sync" class="sidebar-link {% if request.path == '/sync' %}active{% endif %}">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Sync API 2</span>
                </a>
                <a href="/update" class="sidebar-link {% if request.path == '/update' %}active{% endif %}">
                    <i class="fas fa-sync"></i>
                    <span>Update Monthly</span>
                </a>
                <div class="pt-3 mt-3 border-t border-gray-700">
                    <a href="/settings" class="sidebar-link {% if request.path == '/settings' %}active{% endif %}">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto min-h-screen">
            <!-- Top Bar -->
            <div class="bg-white shadow-sm border-b border-gray-200 px-4 sm:px-6 py-2 sm:py-3 flex items-center justify-between sticky top-0 z-20 lg:static">
                <h2 class="text-lg sm:text-xl font-semibold text-gray-800 truncate">{% block page_title %}Dashboard{% endblock %}</h2>
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="relative hidden sm:block">
                        <input type="text" id="global-search" placeholder="Search clients..."
                            class="pl-9 pr-4 py-1.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-44 lg:w-56 text-sm"
                            onkeydown="if(event.key==='Enter'){const v=this.value.trim();if(v)window.location.href='/clients?search='+encodeURIComponent(v);}">
                        <i class="fas fa-search absolute left-3 top-2 text-gray-400 text-sm"></i>
                    </div>
                    <!-- Mobile search button -->
                    <a href="/clients" class="sm:hidden text-gray-500 hover:text-gray-700 p-2" title="Search Clients">
                        <i class="fas fa-search text-lg"></i>
                    </a>
                </div>
            </div>

            <!-- Page Content -->
            <div class="p-3 sm:p-5">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <script>
        // Mobile sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isHidden = sidebar.classList.contains('hidden');
            if (isHidden) {
                sidebar.classList.remove('hidden');
                overlay.classList.remove('hidden');
            } else {
                closeSidebar();
            }
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.add('hidden');
            overlay.classList.add('hidden');
        }

        document.getElementById('mobile-menu-btn')?.addEventListener('click', toggleSidebar);

        // Toast notification helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                info: 'bg-blue-600',
                success: 'bg-green-600',
                error: 'bg-red-600',
                warning: 'bg-yellow-600'
            };
            toast.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in max-w-xs sm:max-w-sm ml-auto`;
            toast.innerHTML = `<span class="text-sm">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // Format currency
        function formatCurrency(value) {
            if (value === null || value === undefined || value === '') return '$0.00';
            const num = parseFloat(value);
            if (isNaN(num)) return '$0.00';
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(num);
        }

        // Format number
        function formatNumber(value) {
            if (value === null || value === undefined || value === '') return '0';
            const num = parseFloat(value);
            if (isNaN(num)) return '0';
            return new Intl.NumberFormat('en-US').format(num);
        }

        // API helpers (also available from main.js)
        async function getJSON(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        async function postJSON(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        // Referrer filter removed — all data comes from API 3 (Tawhid's data)
        function buildUrlWithReferrer(baseUrl) { return baseUrl; }
        function getSelectedReferrer() { return ''; }
        function setSelectedReferrer(referrer) {}
        function initReferrerSelector() {}
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=2"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
